name: Build AI-OS Live ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag (e.g. v1.0.0) to publish ISO"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian 13 amd64 Live ISO inside Debian Trixie container
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            debian:trixie bash -c '
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso isolinux syslinux-common \
                grub-pc-bin grub-efi-amd64-bin dosfstools mtools ca-certificates &&
              bash build-live-iso.sh /workspace/aios-debian-13-amd64-live.iso
            '

      - name: Upload ISO as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aios-debian-13-amd64-live-iso
          path: |
            aios-debian-13-amd64-live.iso
            aios-debian-13-amd64-live.iso.sha256
          retention-days: 30

      - name: Publish to GitHub Release (when tagged)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          files: |
            aios-debian-13-amd64-live.iso
            aios-debian-13-amd64-live.iso.sha256
