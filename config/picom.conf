backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 22;
shadow-offset-x = -22;
shadow-offset-y = -10;
shadow-opacity = 0.35;
shadow-exclude = [
  "class_g = 'Pcmanfm' && window_type = 'desktop'",
  "class_g = 'AITopBar'",
  "class_g = 'Chromium'"
];

blur-background = true;
blur-method = "kernel";
blur-kern = "5x5box";
blur-background-exclude = [
  "class_g != 'AISpotlight' && class_g != 'AITopBar'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

corner-radius = 0;
