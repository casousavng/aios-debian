backend = "xrender";
vsync = false;

shadow = true;
shadow-radius = 22;
shadow-offset-x = -22;
shadow-offset-y = -10;
shadow-opacity = 0.35;
shadow-exclude = [
  "class_g = 'Pcmanfm' && window_type = 'desktop'",
  "class_g = 'AITopBar'",
  "class_g = 'Chromium'"
];

blur-background = false;

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

corner-radius = 0;
