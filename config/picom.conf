backend = "xrender";
vsync = false;
use-damage = false;

shadow = true;
shadow-radius = 16;
shadow-offset-x = -16;
shadow-offset-y = -8;
shadow-opacity = 0.45;
shadow-exclude = [
  "class_g = 'Nemo-desktop'",
  "class_g = 'AITopBar'",
  "class_g = 'AISpotlight'",
  "class_g = 'Chromium'"
];

blur-background = false;

fading = false;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 4;

corner-radius = 0;
